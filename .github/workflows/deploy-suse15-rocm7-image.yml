name: Podman Image CI

on:
  push:
    branches: [main]
    paths: [containers/suse15-rocm7/**, .github/workflows/deploy-suse15-rocm7-image.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: satama
    env:
      IMAGE: oras://satama.csc.fi/${{ vars.SATAMA_PROJECT }}/suse15-rocm7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Singularity
        run: |
          sudo apt-get update
          sudo apt-get install --yes singularity-container
      - name: Build suse15-rocm7
        run: ./containers/suse15-rocm7/build.sh
      - name: Convert to SIF
        run: |
          podman save --format oci-archive --output "$RUNNER_TEMP"/suse15-rocm7.tar suse15-rocm7
          singularity build suse15-rocm7.sif oci-archive://"$RUNNER_TEMP"/suse15-rocm7.tar
          rm "$RUNNER_TEMP"/suse15-rocm7.tar
      - name: Sign SIF
        env:
          SIF_SIGNING_KEY: ${{ secrets.SIF_SIGNING_KEY }}
        run: |
          printf '%s\n' "$SIF_SIGNING_KEY" > "$RUNNER_TEMP"/private.asc
          singularity key import "$RUNNER_TEMP"/private.asc
          rm "$RUNNER_TEMP"/private.asc
          singularity sign suse15-rocm7.sif
          singularity verify --local suse15-rocm7.sif
      - name: Log in to registry
        env:
          SATAMA_USERNAME: ${{ secrets.SATAMA_ROBOT_USERNAME }}
          SATAMA_PASSWORD: ${{ secrets.SATAMA_ROBOT_PASSWORD }}
        run: printf '%s\n' "$SATAMA_PASSWORD" | singularity registry login --username "$SATAMA_USERNAME" --password-stdin oras://satama.csc.fi
      - name: Push to registry
        run: |
          singularity push suse15-rocm7.sif "$IMAGE:$GITHUB_SHA"
          singularity push suse15-rocm7.sif "$IMAGE:latest"
